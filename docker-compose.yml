version: "3.8"

services:
  postgres:
    image: postgres:14-alpine
    container_name: aman-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: aman
    volumes:
      - aman_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d aman"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aman-net

  app:
    build:
      context: src
      dockerfile: Dockerfile
      cache_from:
        - type=local,src=./tmp/.docker-cache
      cache_to:
        - type=local,dest=./tmp/.docker-cache,mode=max
    container_name: aman-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_SECRET: 2888ebd2eeff3d9150267b6bc3c56bb7a220a01505e8da6705cc50baa38c0b48
      APP_HOST: 0.0.0.0
      APP_PORT: 9090
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: root
      POSTGRES_USER: root
      POSTGRES_DB: aman
    ports:
      - "9090:9090"
    networks:
      - aman-net

  nginx:
    image: nginx:stable-alpine
    container_name: aman-nginx
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - aman-net

networks:
  aman-net:
    driver: bridge

volumes:
  aman_postgres_data:
