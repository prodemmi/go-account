version: '3.9'

services:
  account-db:
    image: postgres
    container_name: account-db
    volumes:
      - ./data/:/data/postgres
      - ./sql/:/docker-entrypoint-initdb.d/
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
    hostname: account-db
    networks:
      - account-network

  account-go:
    build: "."
    container_name: account-go
    ports:
      - "9090:9090"
    networks:
      - account-network
    volumes:
      - .:/server
    depends_on:
      - account-db
    environment:
      - APP_PORT=${APP_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - APP_SECRET=${APP_SECRET}
    restart: unless-stopped

networks:
  account-network:
    driver: bridge
