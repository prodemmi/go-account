events {
    worker_connections 1024;
}

http {
    upstream aman_app {
        server app:9090;
    }

    server {
        listen 80;
        server_name cas.layra.local;

        # Custom 404 page served by nginx. The app redirects here instead of
        # returning JSON on errors.
        error_page 404 /404.html;
        location = /not-found {
            return 404;
        }
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }

        # Health check
        location /ping {
            proxy_pass http://aman_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Public API routes
        location /v1/ {
            proxy_pass http://aman_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth pages (CAS branded login/verify-otp)
        location /auth/ {
            proxy_pass http://aman_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin panel
        location /admin/ {
            proxy_pass http://aman_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Catch-all
        location / {
            proxy_pass http://aman_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
