<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>صفحه یافت نشد</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 20% 20%, #1e3a8a 0%, #0f172a 45%, #020617 100%);
            color: #e2e8f0;
            font-family: "Vazirmatn", Tahoma, sans-serif;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 520px;
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 20px;
            padding: 48px 36px;
            text-align: center;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
        }
        .code {
            font-size: 5rem;
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(120deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 16px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 12px; }
        p { color: #94a3b8; line-height: 2; font-size: 0.95rem; margin-bottom: 28px; }
        .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        a {
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: transform .15s ease, opacity .15s ease;
        }
        a:hover { transform: translateY(-2px); opacity: .9; }
        .primary { background: #3b82f6; color: #fff; }
        .secondary { background: rgba(148, 163, 184, 0.14); color: #e2e8f0; border: 1px solid rgba(148,163,184,.25); }
        .foot { margin-top: 28px; font-size: .8rem; color: #64748b; }
    </style>
</head>
<body>
    <main class="card">
        <div class="code">۴۰۴</div>
        <h1>صفحه‌ای که دنبال آن بودید پیدا نشد</h1>
        <p>ممکن است آدرس را اشتباه وارد کرده باشید یا این صفحه حذف شده باشد.</p>
    </main>
</body>
</html>
