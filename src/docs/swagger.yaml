definitions:
  handlers.sendOTPBody:
    properties:
      identifier:
        example: "+989130243519"
        type: string
      captcha_token:
        example: provider-response-token
        type: string
    required:
    - identifier
    type: object
  handlers.terminateSessionsBody:
    properties:
      ids:
        example:
        - 14a03569-d26b-4496-92e5-dfe8cb1855fe
        items:
          type: string
        type: array
    required:
    - ids
    type: object
  handlers.verifyOTPBody:
    properties:
      identifier:
        example: "+989130243519"
        type: string
      otp_code:
        example: "12345"
        type: string
      otp_hash:
        example: fabecfb8ad5895a6a6309e5a7d1b5c48601d1f9e
        type: string
    required:
    - identifier
    - otp_code
    - otp_hash
    type: object
  handlers.verifyOTTBody:
    properties:
      ott:
        example: 9f2c...
        type: string
    required:
    - ott
    type: object
info:
  contact: {}
paths:
  /v1/auth/check:
    get:
      parameters:
      - description: app id
        in: header
        name: APP-ID
        required: true
        type: string
      - description: session token
        in: header
        name: API-TOKEN
        type: string
      responses:
        "200":
          description: Custom auth mode result
          schema:
            additionalProperties: true
            type: object
        "302":
          description: Location
          schema:
            type: string
      summary: Check CAS session (CAS)
      tags:
      - Auth
  /v1/auth/check-login:
    get:
      parameters:
      - description: app id
        in: header
        name: APP-ID
        required: true
        type: string
      - description: session token
        in: header
        name: API-TOKEN
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Check a CAS login (CAS)
      tags:
      - Auth
  /v1/auth/logout:
    delete:
      parameters:
      - description: app id
        in: header
        name: APP-ID
        required: true
        type: string
      responses:
        "302":
          description: Location
          schema:
            type: string
      summary: Logout (CAS)
      tags:
      - Auth
  /v1/auth/me:
    get:
      parameters:
      - description: app id
        in: header
        name: APP-ID
        required: true
        type: string
      - description: session token
        in: header
        name: API-TOKEN
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Current session (CAS)
      tags:
      - Auth
  /v1/auth/send-otp:
    post:
      consumes:
      - application/json
      parameters:
      - description: app id
        in: header
        name: APP-ID
        required: true
        type: string
      - description: payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.sendOTPBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Send OTP (CAS)
      tags:
      - Auth
  /v1/auth/verify-otp:
    post:
      consumes:
      - application/json
      parameters:
      - description: app id
        in: header
        name: APP-ID
        required: true
        type: string
      - description: payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.verifyOTPBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Verify OTP (CAS)
      tags:
      - Auth
  /v1/auth/verify-ott:
    post:
      consumes:
      - application/json
      parameters:
      - description: app id
        in: header
        name: APP-ID
        required: true
        type: string
      - description: payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.verifyOTTBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Verify OTT (CAS)
      tags:
      - Auth
  /v1/user/sessions:
    delete:
      parameters:
      - description: session ids
        in: body
        name: payload
        schema:
          $ref: '#/definitions/handlers.terminateSessionsBody'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Terminate sessions in batch (CAS)
      tags:
      - Sessions
    get:
      parameters:
      - description: app id
        in: header
        name: APP-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List my sessions (CAS)
      tags:
      - Sessions
  /v1/user/sessions/{id}:
    delete:
      parameters:
      - description: session id
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Terminate a session (CAS)
      tags:
      - Sessions
swagger: "2.0"
